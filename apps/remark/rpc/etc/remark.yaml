Name: remark.rpc

Log:
  Mode: file
  Encoding: json
  Path: logs/remark-rpc
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9113
  Path: /metrics

Telemetry:
  Name: remark.rpc
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

ListenOn: 0.0.0.0:8093
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: remark.rpc

DataSource: root:0000@tcp(127.0.0.1:3306)/tj_remark?charset=utf8mb4&parseTime=true&loc=Local

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""
