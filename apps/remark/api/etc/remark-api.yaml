Name: remark-api

Log:
  Mode: file
  Encoding: json
  Path: logs/remark-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9213
  Path: /metrics

Telemetry:
  Name: remark-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8813

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

RemarkRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: remark.rpc
