Name: message-api

Log:
  Mode: file
  Encoding: json
  Path: logs/message-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9207
  Path: /metrics

Telemetry:
  Name: message-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8807

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

MessageRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: message.rpc
