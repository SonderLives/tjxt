Name: auth-api

Prometheus:
  Host: 0.0.0.0
  Port: 9202
  Path: /metrics

Telemetry:
  Name: auth-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8802

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

AuthRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: auth.rpc

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
