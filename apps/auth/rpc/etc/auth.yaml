Name: auth.rpc

Prometheus:
  Host: 0.0.0.0
  Port: 9102
  Path: /metrics

Telemetry:
  Name: auth.rpc
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

ListenOn: 0.0.0.0:8082
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: auth.rpc

DataSource: root:0000@tcp(127.0.0.1:3306)/tj_auth?charset=utf8mb4&parseTime=true&loc=Local

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""

Jwt:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200
  RefreshSecret: "change-me-refresh-in-production"
  RefreshExpire: 604800
