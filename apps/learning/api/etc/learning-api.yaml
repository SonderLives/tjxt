Name: learning-api

Log:
  Mode: file
  Encoding: json
  Path: logs/learning-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9204
  Path: /metrics

Telemetry:
  Name: learning-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8804

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

LearningRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: learning.rpc

# 课程目录展示时，需要查询课程名/章节数等基础信息
CourseRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: course.rpc
