Name: trade-api

Log:
  Mode: file
  Encoding: json
  Path: logs/trade-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9209
  Path: /metrics

Telemetry:
  Name: trade-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8809

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

TradeRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: trade.rpc
