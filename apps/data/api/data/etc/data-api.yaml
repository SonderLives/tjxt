Name: data-api

Log:
  Mode: file
  Encoding: json
  Path: logs/data-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9211
  Path: /metrics

Telemetry:
  Name: data-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8811

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

DataRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: data.rpc
