Name: media.rpc

Log:
  Mode: file
  Encoding: json
  Path: logs/media-rpc
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9106
  Path: /metrics

Telemetry:
  Name: media.rpc
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

ListenOn: 0.0.0.0:8086
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: media.rpc

DataSource: root:${TJXT_DB_PASS|0000}@tcp(127.0.0.1:3306)/tj_media?charset=utf8mb4&parseTime=true&loc=Local

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""

# S3 兼容对象存储（RustFS / MinIO / COS / OSS；docker compose 提供 rustfs 容器。
# 留空 Endpoint 则回退 mock）。本机已有 1Panel RustFS 实例时用环境变量覆盖凭据：
#   TJXT_MINIO_AK / TJXT_MINIO_SK
MinIO:
  Endpoint: 127.0.0.1:9000
  AccessKey: ${TJXT_MINIO_AK|rustfsadmin}
  SecretKey: ${TJXT_MINIO_SK|rustfsadmin}
  Bucket: tjxt-media
  Secure: false
