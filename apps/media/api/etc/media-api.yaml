Name: media-api

Log:
  Mode: file
  Encoding: json
  Path: logs/media-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9206
  Path: /metrics

Telemetry:
  Name: media-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8806

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

MediaRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: media.rpc
