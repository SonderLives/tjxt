Name: search.rpc

Telemetry:/n  Name: search.rpc
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp
ListenOn: 0.0.0.0:8090
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: search.rpc

DataSource: root:0000@tcp(127.0.0.1:3306)/tj_search?charset=utf8mb4&parseTime=true&loc=Local

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""

# 课程服务 RPC（course.up 事件回源课程索引数据）
CourseRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: course.rpc

# 本地 Docker Elasticsearch 9.4.1（9200）。
# Analyzer 默认 cjk：ES 内置、无需插件，中文按二元分词（"汉语世界"→"汉语""语世""世界"），
# 相关性优于 standard 的单字切分。安装 IK/smartcn 插件后可改为 ik_max_word / smartcn；
# IK 场景可另设 SearchAnalyzer: ik_smart（检索侧粗粒度）。
Elasticsearch:
  Addresses:
    - http://127.0.0.1:9200
  Username: ""
  Password: ""
  Analyzer: cjk
  # SearchAnalyzer: ik_smart

# RabbitMQ，消费 course.events 交换机上的 course.up / course.down 事件
RabbitMQ:
  Host: 127.0.0.1
  Port: 5672
  User: rabbitmq
  Pass: rabbitmq

