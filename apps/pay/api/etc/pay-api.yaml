Name: pay-api

Log:
  Mode: file
  Encoding: json
  Path: logs/pay-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9208
  Path: /metrics

Telemetry:
  Name: pay-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8808

Auth:
  AccessSecret: "${TJXT_JWT_SECRET|change-me-in-production}"
  AccessExpire: 7200

# 支付回调签名密钥：sign = hex(hmac_sha256(secret, "payOrderNo=<no>"))
PayNotifySecret: "change-me-pay-notify-secret"

# 模拟支付接口开关：生产必须置 false（TJXT_MOCK_PAY 环境变量覆盖）
MockPayEnabled: ${TJXT_MOCK_PAY|true}

PayRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: pay.rpc
