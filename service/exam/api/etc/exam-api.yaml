Name: exam-api

Log:
  Mode: file
  Encoding: json
  Path: logs/exam-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9205
  Path: /metrics

Telemetry:
  Name: exam-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8805

Auth:
  AccessSecret: "${TJXT_JWT_SECRET|change-me-in-production}"
  AccessExpire: 7200

DataSource: root:${TJXT_DB_PASS|0000}@tcp(127.0.0.1:3306)/tj_exam?charset=utf8mb4&parseTime=true&loc=Local

Cache:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""
