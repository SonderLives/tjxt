Name: data-api

Log:
  Mode: file
  Encoding: json
  Path: logs/data-api
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9211
  Path: /metrics

Telemetry:
  Name: data-api
  Endpoint: 127.0.0.1:4318
  Sampler: 1.0
  Batcher: otlphttp

Host: 0.0.0.0
Port: 8811

Auth:
  AccessSecret: "${TJXT_JWT_SECRET|change-me-in-production}"
  AccessExpire: 7200

# ===== data 后端业务配置（随原 rpc/data 配置合并）=====

# 大屏数据（board/top10/today）Redis 缓存
Redis:
  Host: 127.0.0.1:6379
  Type: node
