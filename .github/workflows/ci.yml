# 持续集成：与本地 `make ci` 同口径（结构校验在 PowerShell 侧，CI 上由逐模块 build 覆盖）。
# 逐模块 build/test/lint —— go.work 工作区下的 ./... 只覆盖主模块，必须循环。
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # buf breaking 需要对比 master，必须拉全量历史（浅克隆下 master 引用不可达）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------- proto 治理门禁（buf）----------
      # buf 只做 lint + breaking 校验；pb/zrpc 生成仍由 goctl 负责，不在 CI 中生成。
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: v1.75.0

      - name: Buf lint
        run: buf lint

      # 双保险：master 仍是 service/<svc>/{api,rpc} 布局时，buf.yaml（指向 app/<svc>/...）
      # 解释 against 侧会报「模块下无 .proto 文件」，回退 buf.master.yaml（按 master 现行
      # service/ 布局声明同一批模块）；合入后 master 即 app/ 布局，第一条命令直接通过。
      - name: Buf breaking (against master)
        run: |
          buf breaking --against '.git#branch=master' --against-config buf.yaml 2>/dev/null || \
          buf breaking --against '.git#branch=master' --against-config buf.master.yaml

      # ---------- go 门禁（与本地 make ci 同口径）----------

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint all modules
        run: |
          set -e
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            if [ "${m#./}" = "." ]; then continue; fi
            echo "lint ${m}"
            (cd "${m#./}" && golangci-lint run ./...)
          done

      - name: Test all modules
        run: |
          set -e
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            if [ "${m#./}" = "." ]; then continue; fi
            echo "test ${m}"
            (cd "${m#./}" && go test ./...)
          done

      - name: Build all modules
        run: |
          set -e
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            if [ "${m#./}" = "." ]; then continue; fi   # 根模块仅声明 go 版本，无代码
            echo "build ${m}"
            (cd "${m#./}" && go build ./...)
          done
