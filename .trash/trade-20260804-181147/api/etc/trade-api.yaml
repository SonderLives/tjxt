Name: trade-api
Host: 0.0.0.0
Port: 8810

RabbitMQ:
  Host: 127.0.0.1
  Port: 5672
  User: rabbitmq
  Pass: rabbitmq
  # 事件交换机与路由键，与 learning 服务消费端约定一致
  Exchange: order.exchange
  PayRoutingKey: order.pay
  RefundRoutingKey: order.refund

DB:
  DataSource: "root:0000@tcp(127.0.0.1:3306)/tj_trade?charset=utf8mb4&parseTime=true&loc=Local"
  DriverName: mysql

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

# 课程服务与用户服务内部 HTTP 地址（用于获取课程/学员信息）
# 未启动对应服务时，相关接口会返回依赖不可用错误
CourseService:
  BaseURL: http://127.0.0.1:8812
  Timeout: 3000

UserService:
  BaseURL: http://127.0.0.1:8808
  Timeout: 3000
