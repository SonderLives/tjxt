services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p0000"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    ports: ["5672:5672", "15672:15672"]
  etcd:
    image: bitnami/etcd:3.5
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
    ports: ["2379:2379"]
  # Jaeger 链路追踪后端（UI + OTLP 接收）。
  # 现在 span 由 otel-collector 转发进来（collector → jaeger:4318，走 docker 内网），
  # 故 4317/4318 不再映射到宿主机（已让位给 otel-collector）；UI 仍在 16686。
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI

  # OpenTelemetry Collector（可观测性中枢：trace + metrics + logs）。
  # trace  ：各 Go 服务 Telemetry.Endpoint 写 127.0.0.1:4318，本容器占用后转给 jaeger:4318（docker 内网）。
  # metrics：本容器用 prometheus receiver 抓 26 个宿主机服务的 /metrics（走 host.docker.internal），
  #          再经 prometheus exporter 在 8889 聚合暴露；Prometheus 只抓 otel-collector:8889。
  # logs   ：本容器用 filelog receiver 读取宿主机 ./logs（挂载为 /var/log/tjxt）下的 JSON 日志，
  #          经 loki exporter 推给 loki:3100。业务代码零改动。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC（host）
      - "4318:4318"   # OTLP HTTP（host，go-zero otlphttp + 预留 OTLP logs 走这里）
      - "8889:8889"   # 聚合后的 metrics（host 调试用；Prometheus 走内网 otel-collector:8889）
      - "13133:13133" # health_check
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让 collector 能抓到宿主机上的 Go 服务
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./logs:/var/log/tjxt:ro                # 各 Go 服务写出的 JSON 日志（filelog 采集源）
    depends_on:
      - jaeger
      - loki

  # Loki 日志存储。接收 otel-collector 经 loki exporter 推送的日志。
  # 查询：http://localhost:3100/metrics（健康检查/Loki 自带 API），UI 建议用 Grafana 或 Loki 原生查询。
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"   # Loki HTTP API / 接收推送
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  # Prometheus 性能监控。抓取各 Go 服务的 /metrics。
  # 各服务在宿主机本地运行（非容器），metrics 端口见各 etc yaml 的 Prometheus.Port；
  # 通过 host.docker.internal 访问宿主机。UI/查询在 http://localhost:9090。
  prometheus:
    image: prom/prometheus:v2.53.1
    ports:
      - "9090:9090" # Prometheus UI
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - jaeger

volumes:
  mysql-data:
  redis-data:
