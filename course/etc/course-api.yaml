Name: course-api
Host: 0.0.0.0
Port: 8812

Auth:
  AccessSecret: "change-me-in-production"
  AccessExpire: 7200

DB:
  DataSource: "root:0000@tcp(127.0.0.1:3306)/tj_course?charset=utf8mb4&parseTime=true&loc=Local"
  DriverName: mysql

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ""

# 用户详情表位于 tj_user 库（同实例跨库查询，用于老师信息/操作人姓名）
UserDetailTable: "tj_user.user_detail"
# 免费试看时长（分钟），小节 trailer=1 时生效
TrailerDuration: 5
