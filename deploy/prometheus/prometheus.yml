# 天机学堂 Prometheus 抓取配置
# metrics 现统一由 otel-collector 抓取并聚合暴露（见 deploy/otel-collector/config.yaml），
# 故 Prometheus 只需抓 collector 这一个端点（:8889），不再直连 26 个 Go 服务。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tjxt

scrape_configs:
  # ---- 所有 Go 服务 metrics（已由 collector 聚合在 8889）----
  - job_name: tjxt-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - "otel-collector:8889"   # collector 暴露的聚合 metrics（含 26 个服务）

  # ---- Prometheus 自身 ----
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
