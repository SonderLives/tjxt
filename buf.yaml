# buf workspace 配置（v2）：仓库根统一管理全部 proto 治理。
# 模块分两类：
#   1. 保留 RPC 服务（5 个）：app/<svc>/rpc，pb / zrpc 代码生成仍走 goctl（make rpc）。
#   2. 折叠服务（8 个）：RPC 进程壳已删除，proto 随迁 app/<svc>/api/<svc>.proto（模块根），
#      pb 类型由 buf generate 生成到 app/<svc>/api/backend/pb（make pb，模板见 buf.gen.yaml）。
# 职责边界：buf 承担 lint + breaking 门禁与折叠服务的 pb 类型生成；
# 保留服务的 pb / zrpc 生成仍由 goctl 负责，buf 不接管生成链路。
# 每个模块显式声明稳定 name（buf.build/tjxt/<svc>，仅本地标识、不发布 BSR）：
# buf breaking 按「模块 name + 模块内相对路径」对比文件身份，name 与目录布局解耦，
# 目录迁移/搬家不会把既有 proto 误报为删除；against 侧对照 buf.master.yaml。
version: v2
modules:
  # 保留 RPC 服务（5 个）
  - path: app/user/rpc
    name: buf.build/tjxt/user
  - path: app/course/rpc
    name: buf.build/tjxt/course
  - path: app/learning/rpc
    name: buf.build/tjxt/learning
  - path: app/pay/rpc
    name: buf.build/tjxt/pay
  - path: app/promotion/rpc
    name: buf.build/tjxt/promotion
  # 折叠服务（8 个，proto 在模块根）
  - path: app/auth/api
    name: buf.build/tjxt/auth
  - path: app/exam/api
    name: buf.build/tjxt/exam
  - path: app/media/api
    name: buf.build/tjxt/media
  - path: app/message/api
    name: buf.build/tjxt/message
  - path: app/remark/api
    name: buf.build/tjxt/remark
  - path: app/search/api
    name: buf.build/tjxt/search
  - path: app/trade/api
    name: buf.build/tjxt/trade
  - path: app/data/api
    name: buf.build/tjxt/data
lint:
  # 从官方 STANDARD 类别起步（1.75.0 中 DEFAULT 已废弃并更名为 STANDARD）。
  use:
    - STANDARD
  # 以下规则要求破坏性变更（改字段名/消息名/服务名/包名或挪目录）才能满足，
  # 会直接改变 goctl 生成的 pb/zrpc 代码与线上 RPC 全限定名，故显式豁免；
  # 新增 proto 仍受其余规则（命名风格、syntax、package 规范等）约束。
  except:
    # 包目录一致：要求目录为 app/<svc>/rpc/<svc>/（包名层级），
    # 挪动 proto 会破坏 goctl rpc protoc 的执行路径与仓库既有布局，豁免。
    - PACKAGE_DIRECTORY_MATCH
    # 包版本后缀：要求包名如 user.v1，改包名会改变生成代码与 gRPC 全限定名，豁免。
    - PACKAGE_VERSION_SUFFIX
    # 服务后缀：要求服务名如 UserService，改服务名会改变 RPC 路径 /pkg.Service/Method，
    # 影响 zrpc 客户端与所有调用方，豁免。
    - SERVICE_SUFFIX
    # 字段 snake_case：存量字段大量驼峰（如 userId/pageNo），改字段名会改变 JSON wire
    # 名称与生成 Go 结构体字段，属破坏性变更，豁免（新增字段请遵守 snake_case）。
    - FIELD_LOWER_SNAKE_CASE
    # RPC 请求/响应类型唯一：存量大量复用同一消息作为多个 RPC 的入参/出参，
    # 拆分消息需新建并重命名类型，改变生成代码面，豁免。
    - RPC_REQUEST_RESPONSE_UNIQUE
    # RPC 请求类型命名（RpcNameRequest/ServiceNameRpcNameRequest）：
    # 需重命名消息类型，改变生成 Go 类型名，豁免。
    - RPC_REQUEST_STANDARD_NAME
    # RPC 响应类型命名（RpcNameResponse/ServiceNameRpcNameResponse）：
    # 需重命名消息类型，改变生成 Go 类型名，豁免。
    - RPC_RESPONSE_STANDARD_NAME
